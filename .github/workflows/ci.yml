name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: app

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check src tests

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  validate-config:
    name: Validate Prometheus config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate prometheus.yml and rules
        uses: docker://prom/prometheus:v2.54.1
        with:
          args: >-
            promtool check config /github/workspace/prometheus/prometheus.yml
