route:
  receiver: "default"
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  routes:
    - matchers:
        - severity="critical"
      receiver: "critical"
      repeat_interval: 15m

receivers:
  # Receiver de exemplo (placeholder). Em produção, troque por Slack/e-mail/PagerDuty.
  - name: "default"
    webhook_configs:
      - url: "http://host.docker.internal:5001/alerts"
        send_resolved: true

  - name: "critical"
    webhook_configs:
      - url: "http://host.docker.internal:5001/critical"
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname"]
